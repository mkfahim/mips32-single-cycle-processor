<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">MIPS32 single-cycle CPU overview</title>
  <desc id="desc">The program counter feeds instruction memory, control and datapath work together, data memory returns to the datapath, and the datapath selects the next program counter.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1100" height="520" fill="#f8fafc"/>
  <text x="550" y="38" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">MIPS32 single-cycle CPU</text>
  <g font-family="sans-serif" font-size="16" fill="#0f172a" stroke="#334155" stroke-width="2">
    <rect x="55" y="190" width="150" height="80" rx="12" fill="#dbeafe"/><text x="130" y="222" text-anchor="middle" stroke="none">pc.v</text><text x="130" y="247" text-anchor="middle" stroke="none">Program Counter</text>
    <rect x="280" y="85" width="185" height="80" rx="12" fill="#dcfce7"/><text x="372" y="117" text-anchor="middle" stroke="none">instruction_memory.v</text><text x="372" y="142" text-anchor="middle" stroke="none">Instruction Memory</text>
    <rect x="280" y="285" width="185" height="80" rx="12" fill="#fef3c7"/><text x="372" y="317" text-anchor="middle" stroke="none">control_unit.v</text><text x="372" y="342" text-anchor="middle" stroke="none">Control Unit</text>
    <rect x="560" y="175" width="205" height="115" rx="12" fill="#ede9fe"/><text x="662" y="207" text-anchor="middle" stroke="none">datapath.v</text><text x="662" y="233" text-anchor="middle" stroke="none">register file + ALU</text><text x="662" y="259" text-anchor="middle" stroke="none">write-back + next PC</text>
    <rect x="860" y="285" width="185" height="80" rx="12" fill="#fee2e2"/><text x="952" y="317" text-anchor="middle" stroke="none">data_memory.v</text><text x="952" y="342" text-anchor="middle" stroke="none">Data Memory</text>
  </g>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M205 220 H280"/><path d="M465 125 H520 Q540 125 560 190"/><path d="M465 325 H540 Q550 325 560 275"/><path d="M765 235 H860"/><path d="M860 325 H800 Q780 325 765 275"/><path d="M560 245 H230 Q205 245 205 250"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#475569">
    <text x="235" y="210">address</text><text x="485" y="112">instruction</text><text x="485" y="315">control signals</text><text x="790" y="225">address / write data</text><text x="785" y="348">read data</text><text x="300" y="405">The top-level module wires these blocks together.</text>
  </g>
</svg>
